  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    <p>

    The <xref href="mosaic_libary.ZeroCrossings" data-throw-if-not-resolved="false"></xref> block computes the number of zero crossings in each channel of a windowed input signal.

    This feature is widely used in EMG analysis to represent signal frequency content or activity.

    </p>
  remarks: >-
    The input to this block should be a matrix (windowed data, samples × channels).

    The output is a vector with the zero crossing count for each channel.

    A zero crossing is counted only if the sign of the signal changes between consecutive samples, and the amplitude change exceeds the set threshold.
  example:
  - >-
    <p>

    Example YAML configuration for a ZeroCrossings block:

    </p>

    <pre><code class="lang-csharp">zcBlock:

    {
      Type: ZeroCrossings,
      Inputs: [windowedEMG],
      Params: [0.02]
    }</code></pre>

    <p>

    Explanation:

    <ul><li><code>Type: ZeroCrossings</code> specifies this block extracts the zero crossing feature from each channel in the input.
        </li><li><code>Inputs: [windowedEMG]</code> provides the (windowed) data matrix for ZC extraction; typically, this is the output of a SlidingWindow block.
        </li><li><code>Params: [0.02]</code> sets the minimum amplitude difference required to count a zero crossing (to reduce noise influence).
        </li></ul>
    In this configuration, the ZC block counts, for each channel, the number of times the signal crosses zero (changes sign) within the input window and the difference between samples exceeds 0.02.

    </p>
