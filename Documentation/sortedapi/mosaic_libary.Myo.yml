  namespace: mosaic_libary
  summary: >-
    Myo - Receives data from one Thalmic Lab Myo device connected through BLE and outputs EMG samples.

    If you want to connect to multiple Myo devices, you need to create multiple Myo blocks in your YAML file.
  example:
  - >-
    <p>

    A typical YAML configuration might look like this:

    </p>

    <pre><code class="lang-csharp">myoBlock:

    {
      Type: MYO,
      Inputs: [ myTimer ],
      Params: [ "00:00:00:00:00:00" ]
    }</code></pre>

    <p>

    Explanation:

    <ul><li><code>Type: MYO</code> specifies that this block reads EMG data from a Myo device.
        </li><li><code>Inputs: [ myTimer ]</code> indicates the Myo block depends on a timer block 
          (could be <xref href="mosaic_libary.Timer" data-throw-if-not-resolved="false"></xref> or <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref>) to schedule data acquisition ticks.
        </li><li><code>Params: [ "00:00:00:00:00:00" ]</code> optionally provides the MAC address of the Myo to connect to. 
          If left blank or omitted, you can specify it later in the UI or let the system search for available devices.
        </li></ul>

    In this setup, the block named <code>myTimer</code> triggers the Myo block at the desired rate, and the <code>myoBlock</code> 

    establishes a BLE connection (using the specified MAC address) to stream 8-channel EMG data.

    </p>
  syntax:
    content: 'public class Myo : Block, IDisposable'
    content.vb: Public Class Myo Inherits Block Implements IDisposable
