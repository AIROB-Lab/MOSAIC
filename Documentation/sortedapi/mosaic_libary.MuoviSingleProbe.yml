    id: MuoviSingleProbe
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\MuoviSingleProbe.cs
    startLine: 96
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    The <xref href="mosaic_libary.MuoviSingleProbe" data-throw-if-not-resolved="false"></xref> class acquires EMG data from a single Muovi probe over a TCP connection. 

    It expects exactly one <xref href="mosaic_libary.Timer" data-throw-if-not-resolved="false"></xref> input block, which triggers data parsing at a specified sampling rate.
  remarks: >-
    This version is specialized for a single probe and does not rely on the <code>Params</code> array to specify probe indices.

    You must be connected to the single probe’s Wi-Fi network. Press the On/Off Button for &gt;5 seconds on the probe 

    and connect to the probe’s Wi-Fi network before running this block.
  example:
  - >-
    <pre><code class="lang-csharp">muovi_singleprobe:

    {
      Type: MuoviSingleProbe,
      Inputs: [ myTimerBlock ]
      # Note: No Params array is provided here, 
      #       as this block uses a single default probe internally.
    }</code></pre>

    <p>Explanation:</p>

    <ul><li>
          <code>Type: MuoviSingleProbe</code> indicates that this block connects to the Muovi SyncStation, 
          awaiting a TCP connection and acquiring data from one selected probe.
        </li><li>
          <code>Inputs: [ myTimerBlock ]</code> shows that it must have exactly one <xref href="mosaic_libary.Timer" data-throw-if-not-resolved="false"></xref> 
          (or a derived class like <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref>) to drive data parsing at the chosen rate.
        </li></ul>
    <p>

    After the block establishes a TCP connection with the Muovi SyncStation, it begins streaming EMG data 

    at a nominal 2 kHz rate and downsamples/batches the samples according to the timer’s <code>DesiredRate</code>.

    </p>
