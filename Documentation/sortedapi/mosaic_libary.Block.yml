- uid: mosaic_libary.Block.Ticks
  commentId: F:mosaic_libary.Block.Ticks
  id: Ticks
  parent: mosaic_libary.Block
  langs:
  - csharp
  - vb
  name: Ticks
  nameWithType: Block.Ticks
  fullName: mosaic_libary.Block.Ticks
  type: Field
  source:
    id: Ticks
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Basics.cs
    startLine: 172
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Circualar Buffer <code>Ticks</code> for evaluating the rate. Buffer consists of 100 timestamps calles <code>Ticks</code>. Each time an output is produced, i.e., whenever <code>SendOutput(value)</code> is 

    called, the current timestamp is added to <code>Ticks</code>; whenever <code>Rate</code> is queried, the total number of elements currently in <code>Ticks</code> is divided by the difference between the 

    last and first timestamps in it.

    >[!NOTE]

    >Why not simply evaluating the rate since the birth of the block, instead of taking the burden of memorising the past 100 timestamps? Because a block can 

    >be started and stopped arbitrarily – actually, whether it is running depends on the blocks it is connected to – so at some point evaluating the rate over the whole 

    >course of time could become very inaccurate. Picture, e.g., the case in which a block has been running at 2kHz for one minute, then it has stopped running for two minutes, 

    >then it has run again at 2kHz for one minute: the rate since the start in this case is 1kHz, which is deadly wrong in any possible sense; using the timestamps instead, the rate 

    >is evaluated only over the “recent past”.
  example: []
  syntax:
    content: private readonly CircularBuffer<double> Ticks
    return:
      type: mosaic_libary.CircularBuffer{System.Double}
    content.vb: Private ReadOnly Ticks As CircularBuffer(Of Double)
