  namespace: mosaic_libary
  summary: >-
    Rate defiened as (#ticks-1 / _deltaT), where 

    - #ticks is the length of the timestamp buffer so far

    - _deltaT is the difference between the last and first timestamp in the buffer 

    A new Timestamp is added to <code>Ticks</code> from each call off <code>SendOutput</code>.

    Total Numer of Elements in <code>Ticks</code> divied by the diffrence between the last and first timestamp in <code>Ticks</code>.
