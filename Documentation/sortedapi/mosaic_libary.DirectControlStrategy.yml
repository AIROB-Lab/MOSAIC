    id: DirectControlStrategy
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\ControlAlgorithms\DirectControlStrategy.cs
    startLine: 32
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Maps the prediction values to the corresponding Degrees of Actuation (DOAs).

    Each DOA represents a specific movement, and the received prediction vector is normalized between [0,1].

    This mapping scales the values to the range [0,100] for actuation.

    /// The prediction vector follows the order defined in the configuration file:

    <ul><li>[0] → Thumb Flexion</li><li>[1] → Thumb Rotation</li><li>[2] → Index Finger Flexion</li><li>[3] → Middle Finger Flexion</li><li>[4] → Ring Finger Flexion</li><li>[5] → Little Finger Flexion</li><li>[6] → Wrist Flexion</li><li>[7] → Wrist Extension</li><li>[8] → Wrist Pronation</li><li>[9] → Wrist Supination</li><li>[10] → Wrist Ulnar Deviation</li><li>[11] → Wrist Radial Deviation</li><li>[12] → Open Hand </li><li>[13] → Elbow Felxion </li><li>[14] → Elbow Extension </li></ul>
  example: []
  syntax:
    content: 'public class DirectControlStrategy : IControlAlgorithmStrategy'
    content.vb: Public Class DirectControlStrategy Implements IControlAlgorithmStrategy
