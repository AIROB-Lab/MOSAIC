  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Represents a specialized <xref href="mosaic_libary.Block" data-throw-if-not-resolved="false"></xref> that performs various vectorial operations on input vectors,

    potentially involving one or two source input blocks. This class provides functionality

    to configure inputs, parse operation parameters, and process new incoming Vector data

    to produce resultant vectors based on the specified operation.


    Operations supported by this class include:

    <ul><li><code>rotation</code>: Applies a rotational transform to an input Vector using specified roll, pitch, and yaw angles.</li><li><code>absolute_value</code>: Computes the magnitude (L2 norm) of the input Vector.</li><li><code>wrench_projection</code>: Projects a wrench Vector using a configurable projection matrix constructed from the input vectors.</li><li><code>addVectors</code>: Adds two input vectors element-wise.</li><li><code>subtract</code>: Subtracts the second input Vector from the first, element-wise.</li><li><code>crossVector</code>: Computes the cross product of two 3D input vectors.</li><li><code>scalarProduct</code>: Computes the scalar (dot) product of two input vectors.</li><li><code>matrix_multiply</code>: Multiplies the input Vector by a provided projection matrix.</li><li><code>integrate</code>: Integrates the input Vector over time by accumulating its values.</li></ul>
  example:
  - >-
    <pre><code class="lang-csharp">myVectorOp:

    {
      Type: VectorialFunction,
      Inputs: [ inputAName, inputBName ],
      Params: [ "subtract" ]
    }</code></pre>
     Explanation:
     <ul><li><code>Type: VectorialFunction</code> indicates that this block will perform one of the available vector operations 
           (e.g., <code>subtract</code>).
         </li><li><code>Inputs: [ inputA, inputB ]</code> shows two upstream blocks providing vectors. 
           For <code>subtract</code>, the second vector is subtracted from the first.
         </li><li><code>Params: [ "subtract" ]</code> configures the specific operation to be performed. 
           Other operations (e.g., <code>addVectors</code>, <code>absolute_value</code>) can be substituted as needed.
         </li></ul>

     When both <code>inputA</code> and <code>inputB</code> are received, this block subtracts the second input from the first, 
     element by element, and outputs the resulting vector.
