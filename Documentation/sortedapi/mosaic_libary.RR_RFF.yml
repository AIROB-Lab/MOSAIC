  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Maps a single input vector to the RFF space using the transformation:

    phi(x) = cos(Omega * x + beta)
  example: []
  syntax:
    content: private Vector<double> phi(Vector<double> x)
    parameters:
    - id: x
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The input vector.
    return:
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The transformed vector in the RFF space.
