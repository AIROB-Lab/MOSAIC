    id: IncrementalPredictor
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Learning\IncrementalPredictor.cs
    startLine: 134
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Implements a block containing an incremental learning machine, suitable for environments where the model

    needs to be updated dynamically with new data. It receives input samples from a data <xref href="mosaic_libary.Block" data-throw-if-not-resolved="false"></xref>

    and target values from a <xref href="mosaic_libary.Trigger" data-throw-if-not-resolved="false"></xref>, updating the model with each new target value received.
  example:
  - >-
    <pre><code class="lang-csharp">incremental_learn:

    {
      Type: IncrementalPredictor,
      Inputs: [ DataBlockName, TriggerBlockName ],
      Params: [ IncrementalLearningMachineName, 8, 12, ...hyperparameters... ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: IncrementalPredictor</code> designates that this block updates its model 
        incrementally (on a per-sample or per-target basis), as opposed to batch updates.</li><li><code>Inputs: [ DataBlockName, TriggerBlockName ]</code> shows that the first input must be a data containing Block, which
          provides new data samples, while the second input must be a <xref href="mosaic_libary.Trigger" data-throw-if-not-resolved="false"></xref> Block, that supplies target values 
          for model updates.
        </li><li><code>Params</code> includes:
          <ol><li>The name of the incremental learning machine class 
            (e.g., <code>IncrementalLearningMachineName</code>).</li><li>The input dimension (<code>8</code>) and output dimension (<code>12</code>) for the model.</li><li>Optional hyperparameters (e.g., <code>lambda</code>, <code>sigma</code>, etc.).</li></ol></li></ul>

    When <code>triggerBlock</code> sends a target vector, the incremental model is updated. 

    When it sends <code>null</code>, the block saves the current model state to disk (if configured).
