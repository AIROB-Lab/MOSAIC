  source:
    id: FilePlayer
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\FlowControl\FilePlayer.cs
    startLine: 454
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Represents a FilePlayer for reading and playing back data from files. Data will be played 

    at the <code>DesiredRate</code> defined by the <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref> input block.
  example:
  - >-
    <pre><code class="lang-csharp">myFilePlayer:

    {
      Type: FilePlayer,
      Inputs: [ myTimer ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: FilePlayer</code> indicates that this block reads data from a file and outputs 
          it one sample (or vector) per timer tick.
        </li><li><code>Inputs: [ myTimer ]</code> means the block uses <code>myTimer</code> to drive its playback rate. 
          Each timer tick triggers the reading of the next sample from the file.
        </li></ul>
  syntax:
    content: 'public class FilePlayer : Block, IDisposable'
    content.vb: Public Class FilePlayer Inherits Block Implements IDisposable
