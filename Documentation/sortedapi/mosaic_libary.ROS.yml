  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Provides integration with the Robot Operating System (ROS) by connecting to a ROS bridge server 

    and either subscribing to or publishing messages on specified ROS topics.
  remarks: >-
    Before running the code, make sure the ROS bridge is running either on WSL or a docker with exposed port 9090 (Websocket port).
     <p><strong>Setup Instructions</strong><ol><li>
           Source your ROS environment. For example (ROS2 Humble):
           <pre><code class="lang-csharp">source /opt/ros/humble/setup.bash</code></pre></li><li>
           Start the ROS bridge (exposing WebSocket port 9090). For example:
           <ul><li><strong>ROS1</strong>:
                 <pre><code class="lang-csharp">roslaunch rosbridge_server rosbridge_websocket.launch</code></pre></li><li><strong>ROS2</strong>:
                 <pre><code class="lang-csharp">ros2 launch rosbridge_server rosbridge_websocket_launch.xml</code></pre></li></ul></li><li>
           Once the bridge is running, you can observe published messages on a topic using:
           <pre><code class="lang-csharp">rostopic echo /example_topic2</code></pre></li></ol></p><p><strong>Parameters (Params)</strong><ol><li><code>"IP"</code> – The IP address of the WebSocket server.</li><li><code>"publish" or "subscribe"</code> – Specify <code>"publish"</code> to send messages, 
           or <code>"subscribe"</code> to receive messages.</li><li><code>"Topic_name"</code> – The name of the ROS topic for publishing/subscribing.</li><li><code>"Message_Type"</code> – The ROS message type (e.g., <code>std_msgs/Float64MultiArray</code>). 
           Other options are documented at 
           <a href="http://docs.ros.org/en/melodic/api/std_msgs/html/index-msg.html">http://docs.ros.org/en/melodic/api/std_msgs/html/index-msg.html</a>.
         </li></ol></p>
  example: []
