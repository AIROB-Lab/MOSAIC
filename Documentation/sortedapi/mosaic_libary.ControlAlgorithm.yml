  source:
    id: ControlAlgorithm
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\ControlAlgorithms\ControlAlgorithm.cs
    startLine: 134
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    <code>ControlAlgorithm</code> - Receives prediction vectors and maps them to actuation values based on the selected control algorithm strategy.
     This block supports multiple control strategies, allowing for different methods of interpreting EMG-based predictions.
     Currently implemented are DirectControl and StepwiseControl.
  remarks: >-
    Steps to add a new Control Algorithm Strategy to the system.

    This guide ensures the <xref href="mosaic_libary.ControlAlgorithm" data-throw-if-not-resolved="false"></xref> class remains modular and extensible.

    <p>

    Follow these steps to implement a new control strategy within the system:

    </p><ol><li><strong>Create a new class</strong> that implements the <xref href="mosaic_libary.IControlAlgorithmStrategy" data-throw-if-not-resolved="false"></xref> interface.
          This class will define the new algorithm's logic.
        </li><li><strong>Implement the required methods:</strong><ul><li>Initialize the control dictionary for all required <xref href="mosaic_libary.DOAs" data-throw-if-not-resolved="false"></xref>.</li><li>Define the logic for processing prediction data inside <code>ProcessPrediction(Vector prediction)</code>.</li><li>Ensure <code>GetControlDict()</code> correctly returns the updated actuation values.</li></ul></li><li><strong>Update the <xref href="mosaic_libary.ControlAlgorithm" data-throw-if-not-resolved="false"></xref> constructor</strong> to recognize the new strategy.
          Modify the switch statement to include a case for the new algorithm type, assigning it to <code>_controlAlgorithm</code>.
        </li><li><strong>Add the new algorithm type</strong> to the <xref href="mosaic_libary.Algorithms" data-throw-if-not-resolved="false"></xref> enumeration.
          This ensures the new strategy can be referenced correctly in the code.
        </li><li><strong>Update the YAML configuration</strong> to support the new algorithm type.
          Modify the control block definition to include the new algorithm name as a valid parameter.
        </li><li><strong>Test the implementation:</strong><ul><li>Ensure the system correctly selects and executes the new algorithm.</li><li>Verify that the expected actuation values are generated from input predictions.</li><li>Check that switching between algorithms works as intended.</li></ul></li><li><strong>Update documentation</strong> to reflect the newly added control algorithm strategy.
          Ensure that system users can configure and utilize the new algorithm in their YAML setup.
        </li></ol>
  example:
  - >-
    <p>
     A typical YAML configuration might look like this:
     </p>
    <pre><code class="lang-csharp">controlAlgorithm:

    {
      Type: ControlAlgorithm,
      Inputs: [ NameOfPredictor ],
      Params: [ "algorithm:NameOfControl" ]
    }</code></pre>

    <p>
     Explanation:
     <ul><li><code>Type: ControlAlgorithm</code> specifies that this block processes prediction data and transforms it into actuation commands.
         </li><li><code>Inputs: [ NameOfPredictor ]</code> defines the input block that provides real-time prediction vectors. 
           This input can be from a machine learning model such as <xref href="mosaic_libary.IncrementalPredictor" data-throw-if-not-resolved="false"></xref> or <xref href="mosaic_libary.BatchPredictor" data-throw-if-not-resolved="false"></xref>.
         </li><li><code>Params: [ "algorithm:NameOfControl" ]</code> determines which control strategy to use. 
           Available algorithms are <code>DirectControl</code> (see <xref href="mosaic_libary.DirectControlStrategy" data-throw-if-not-resolved="false"></xref>) and <code>StepwiseControl</code> (see <xref href="mosaic_libary.StepwiseControlStrategy" data-throw-if-not-resolved="false"></xref>). 
           New strategies can be added without modifying this class due to its dependency injection structure.
         </li></ul>

     In this setup, the block named <code>incr_learn_prediction</code> provides continuous prediction data, 
     which is then processed by <code>controlAlgorithm</code> to generate actuation values for the system.
     </p>
  syntax:
    content: 'public class ControlAlgorithm : Block, IDisposable'
    content.vb: Public Class ControlAlgorithm Inherits Block Implements IDisposable
