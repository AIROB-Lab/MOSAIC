  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    SlidingWindow - Applies a window function over streaming input data using a sliding window of fixed length and stride.

    Supports various window functions (Rectangular, Hamming, Hann).

    Useful for feature extraction, signal smoothing, or framing for further processing.
  example:
  - >-
    <p>

    A typical YAML configuration for a sliding window block may look like this:

    </p>

    <pre><code class="lang-csharp">slidingWindowBlock:

    {
      Type: SlidingWindow,
      Inputs: [ myo ],
      Params: [ "128", "32", "Hamming" ]
    }</code></pre>

    <p>

    Explanation:

    <ul><li><code>Type: SLIDINGWINDOW</code> specifies that this block performs a sliding window operation.
        </li><li><code>Inputs: [ emgBlock ]</code> specifies the input data source for the sliding window, e.g., an EMG data block.
        </li><li><code>Params: [ "128", "32", "Hamming" ]</code> defines the parameters:
          <ol><li><code>128</code> - Window size (number of samples per window).
            </li><li><code>32</code> - Stride (step size between windows).
            </li><li><code>Hamming</code> - Window function to apply (other options: Rectangular, Hann).
            </li></ol></li></ul>

    In this configuration, the block processes data from <code>emgBlock</code>, grouping incoming samples into windows of 128 samples,

    sliding forward by 32 samples for each output, and applying a Hamming window to each segment before outputting the result.

    </p>
