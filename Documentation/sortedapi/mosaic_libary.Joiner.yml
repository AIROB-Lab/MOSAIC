  namespace: mosaic_libary
  summary: Joins multiple input streams into a single output stream. Requires a designated block that acts as a timer to trigger output.
  example:
  - >-
    <pre><code class="lang-csharp">myJoiner: 

    {
      Type: Joiner,
      Inputs: [ BlockAName, sensorBlockBName, timerBlockName ],
      Params: [ "timerBlockName:timerBlockName" ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: Joiner</code> indicates that this block combines data from multiple inputs into a single output.</li><li><code>Inputs: [ BlockAName, BlockBName, timerBlock ]</code> shows three different input blocks:
          <ul><li><strong>BlockA</strong> and <strong>BlockB</strong> might provide numeric vectors.</li><li><strong>timerBlock</strong> is the designated block whose arrival of data triggers the Joiner to produce output.</li></ul></li><li><code>Params: [ "timerBlockName:timerBlockName" ]</code> tells the Joiner which input block to treat as the timer. 
        When data arrives from this block, the Joiner concatenates all currently stored vectors and outputs the combined row.</li></ul>

    This configuration allows the Joiner to collect data from multiple streams at different times, 

    and then send a single, merged vector whenever the timer block triggers.
