  namespace: mosaic_libary
  summary: Implements Incremental Ridge Regression (IRR), an online version of Ridge Regression.
  remarks: >-
    This algorithm uses the Sherman-Morrison formula to efficiently perform rank-1 updates to the model, 

    allowing for incremental learning without rebuilding the model from scratch for each new data point.

    The regression model is represented as:

    <pre><code class="lang-csharp">W = Ainv * B</code></pre>

    Where:

    <ul><li><code>Ainv</code> is the pseudo-inverse of the feature matrix (updated incrementally).</li><li><code>B</code> accumulates the outer product of inputs and targets.</li></ul>
  example: []
  syntax:
    content: 'public class IncrementalRidgeRegression : IncrementalLearningMachine'
    content.vb: Public Class IncrementalRidgeRegression Inherits IncrementalLearningMachine
