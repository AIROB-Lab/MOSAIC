  namespace: mosaic_libary
  summary: >-
    Responds to new input signals by adjusting the state of the FSM and generating the appropriate target values.

    This method embodies the core logic of the Stimulus FSM, dictating the flow and transitions between states

    based on elapsed time and the sequence of tasks.
  example: []
  syntax:
    content: protected override void OnNewInput(Block sender, object value)
    parameters:
    - id: sender
      type: mosaic_libary.Block
      description: The source of the input signal, typically a timer.
    - id: value
      type: System.Object
      description: The input value, not used in this implementation as the state transitions are time-based.
    content.vb: Protected Overrides Sub OnNewInput(sender As Block, value As Object)
