    id: SinGenerator
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\SinGenerator.cs
    startLine: 92
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    SinGenerator - Generates a signal with d sinusoidal components (<xref href="mosaic_libary.SinGenerator._componentCount" data-throw-if-not-resolved="false"></xref>) with different phases:
      $$ s_i = G*sin(2  π  nu t + (phi+10*i) ), i=1,...,d $$
     <ul><li>d: Componenten Count</li><li>G: Amplitude</li><li>nu: Frequency</li><li>phi: phase</li></ul>
       Useful if you want to test your stuff but have no real sensors attached to the system.
       Specify the parameters in the cfg file as: [d G nu phi].
  example:
  - >-
    Example YAML configuration for the <xref href="mosaic_libary.SinGenerator" data-throw-if-not-resolved="false"></xref> Block:

    <pre><code class="lang-csharp">sinGenerator:
      {
        Type: SinGenerator,
        Inputs: [ MyTimer ],
        Params: [ 3, 2.5, 0.25, 1.57 ]
      }</code></pre>
    Explanation:

    - <code>Type: SinGenerator</code> indicates the block type.

    - <code>Inputs: [ MyTimer ]</code> shows the name of the one required input block, which must be a Timer.

    - <code>Params: [ 3, 2.5, 0.25, 1.57 ]</code> corresponds to:
      - 3 = <code>d</code> (number of sinusoidal components)
      - 2.5 = <code>G</code> (amplitude)
      - 0.25 = <code>nu</code> (frequency, in Hz)
      - 1.57 = <code>phi</code> (phase, in radians)

    Or 


    /// <pre><code class="lang-csharp">sinGenerator:
          {
            Type: SinGenerator,
            Inputs: [ MyTimer ],
            // Only specifying the first parameter (d = 1):
            Params: [ 1 ]
          }</code></pre>
    In this minimal configuration:

    - The number of sinusoidal components = 1

    - The default amplitude (G) is 1

    - The default frequency (nu) is 0.2

    - The default phase (phi) is 0


    The resulting output is a single sinusoidal component with the defaults for amplitude, frequency, and phase.
