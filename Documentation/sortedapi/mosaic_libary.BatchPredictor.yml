    id: BatchPredictor
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Learning\BatchPredictor.cs
    startLine: 110
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    A block that encapsulates a batch learning machine for predictive modeling. It gathers data samples from a specified provider

    and uses a buffer to build a predictive model. Ideal for scenarios where model construction or update is based on a batch of data rather than streaming data.
  remarks: >-
    Batch prediction involves creating or updating a predictive model using a batch (or collection) of data points at once, rather than 

    updating the model incrementally with each new data point. This approach is often used in scenarios where the model benefits from being 

    trained or retrained on a comprehensive dataset to improve accuracy or when real-time prediction is not required. 

    The <xref href="mosaic_libary.BatchPredictor" data-throw-if-not-resolved="false"></xref> class wraps around a machine learning model, facilitating the collection of data, model training, and prediction in a 

    batch processing manner.
  example:
  - >-
    <pre><code class="lang-csharp">batch_learn: 

    { 
        Type: BatchPredictor,
        Inputs: [ name of Data Block ],
        Params: [ name of Buffer, name of LearningMachine, 8, 12, ...other hyperparameters... ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: BatchPredictor</code> indicates that the block constructs or updates 
          a predictive model using batches of data, rather than incremental samples.
        </li><li><code>Inputs: [ Data BLock ]</code> needs that the block receives data from an EMG or signal-providing.
        </li><li><code>Params: [ name_of_buffer, NameOfLearningMachine, 8, 12, ... ]</code> includes:
          <ol><li>The name of the <code>Buffer</code> storing data for model building.</li><li>The class name of the machine learning model (e.g., <code>NameOfLearningMachine</code>). Current LearningMachines are <xref href="mosaic_libary.RidgeRegression" data-throw-if-not-resolved="false"></xref> and <xref href="mosaic_libary.RR_RFF" data-throw-if-not-resolved="false"></xref></li><li>The input dimension (<code>8</code>) and output dimension (<code>12</code>), followed by optional hyperparameters.</li></ol></li></ul>
