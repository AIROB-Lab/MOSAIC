  summary: >-
    Downgrades the model by removing the influence of a specific input-output pair.

    This is useful for scenarios where a previously learned data point is no longer valid or relevant.
  example: []
  syntax:
    content: public abstract void DowndateModel(Vector<double> x, Vector<double> y)
    parameters:
    - id: x
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The input vector representing the data point to be removed from the model.
    - id: y
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The output vector representing the target associated with the input vector.
    content.vb: Public MustOverride Sub DowndateModel(x As Vector(Of Double), y As Vector(Of Double))
