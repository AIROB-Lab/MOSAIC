      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The input vector representing a single data point in the input space (R^d).
    - id: y
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: The output vector representing the corresponding target in the output space (R^M).
