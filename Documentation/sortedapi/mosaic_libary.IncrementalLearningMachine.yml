  summary: >-
    Represents an abstract base class for an incremental learning machine.

    This class extends the <xref href="mosaic_libary.PredictingMachine" data-throw-if-not-resolved="false"></xref> to allow models that can be updated or downgraded incrementally

    as new data points are provided or removed.
