  type: Method
  source:
    id: Print
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Utils.cs
    startLine: 395
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Pretty-printing function used to properly dump vectors in SendOutput
  example: []
  syntax:
    content: public static string Print(object o, string timeStamp = "")
    parameters:
    - id: o
      type: System.Object
      description: >-
        <code>object</code> to be print 

        <ul><li><span class="term">o == null</span>NaN</li><li><span class="term">o == Vector</span>print in matlab-compatible format

        </li><li><span class="term">o == matrix</span>print it in matlab-compatible format (one row per line)

        </li><li><span class="term">anything else</span>print the standard way <code>$"{o}"</code></li></ul>
    - id: timeStamp
      type: System.String
      description: ''
    return:
      type: System.String
      description: Returns input <code>object o</code> as <code>string</code>. Formatting criteria see above.
    content.vb: Public Shared Function Print(o As Object, timeStamp As String = "") As String
