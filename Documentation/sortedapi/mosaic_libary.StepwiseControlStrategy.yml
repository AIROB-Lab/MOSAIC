  source:
    id: .ctor
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\ControlAlgorithms\StepwiseControlStrategy.cs
    startLine: 59
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Initializes a new instance of the <xref href="mosaic_libary.StepwiseControlStrategy" data-throw-if-not-resolved="false"></xref> class.

    Sets initial values for all DOAs.

    The prediction vector follows the structure defined in the configuration file:

    <ul><li>[0] → Thumb Flexion</li><li>[1] → Thumb Rotation</li><li>[2] → Index Finger Flexion</li><li>[3] → Middle Finger Flexion</li><li>[4] → Ring Finger Flexion</li><li>[5] → Little Finger Flexion</li><li>[6] → Wrist Flexion</li><li>[7] → Wrist Extension</li><li>[8] → Wrist Pronation</li><li>[9] → Wrist Supination</li><li>[10] → Wrist Ulnar Deviation</li><li>[11] → Wrist Radial Deviation</li><li>[12] → Elbow Flexion</li><li>[13] → Elbow Extension</li><li>[14] → Global Open Hand Activation</li></ul>
  example: []
  syntax:
    content: public StepwiseControlStrategy()
    content.vb: Public Sub New()
  overload: mosaic_libary.StepwiseControlStrategy.#ctor*
  nameWithType.vb: StepwiseControlStrategy.New()
  fullName.vb: mosaic_libary.StepwiseControlStrategy.New()
  name.vb: New()
