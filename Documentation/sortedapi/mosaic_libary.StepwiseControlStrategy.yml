    id: ProcessPrediction
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\ControlAlgorithms\StepwiseControlStrategy.cs
    startLine: 74
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Processes the prediction vector and updates actuation values accordingly.
  remarks: >-
    The interpretation of the prediction values depends on the specific control strategy.

    Implementing classes must define how the mapping is performed.
  example: []
  syntax:
    content: public void ProcessPrediction(Vector<double> prediction)
    parameters:
    - id: prediction
      type: MathNet.Numerics.LinearAlgebra.Vector{System.Double}
      description: >-
        A vector containing predicted activation values for each Degree of Actuation (DOA).

        The values are typically in the range [0,1] and need to be mapped to [0,100] for actuation.
    content.vb: Public Sub ProcessPrediction(prediction As Vector(Of Double))
