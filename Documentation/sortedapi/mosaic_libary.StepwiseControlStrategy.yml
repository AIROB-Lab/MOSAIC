    id: StepwiseControlStrategy
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\ControlAlgorithms\StepwiseControlStrategy.cs
    startLine: 22
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Implements the Stepwise Control strategy, which updates actuation values 

    incrementally based on thresholded activation levels from the prediction vector.

    Used in <xref href="mosaic_libary.ControlAlgorithm" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The Stepwise Control strategy ensures that movements are adjusted gradually 

    rather than mapped directly from the prediction vector. It uses a threshold (_deadBand)

    to prevent unintended minor activations and scales actuation values incrementally 

    with <xref href="mosaic_libary.StepwiseControlStrategy._dsMax" data-throw-if-not-resolved="false"></xref> (step size).
  example: []
  syntax:
    content: 'public class StepwiseControlStrategy : IControlAlgorithmStrategy'
    content.vb: Public Class StepwiseControlStrategy Implements IControlAlgorithmStrategy
