  namespace: mosaic_libary
  summary: >-
    Handles new input from the connected Stimulus block. Outputs the second element of a tuple during "capture" state

    and sends a null value once when exiting the capture state.
  example: []
  syntax:
    content: protected override void OnNewInput(Block sender, object value)
    parameters:
    - id: sender
      type: mosaic_libary.Block
      description: The sender of the input event.
    - id: value
      type: System.Object
      description: The value of the input event, expected to be a tuple of (string, Vector).
