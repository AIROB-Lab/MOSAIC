  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    StimTrigger converts the output event from a <xref href="mosaic_libary.Stimulus" data-throw-if-not-resolved="false"></xref> into commands that a Buffer can use

    to start or stop gathering data. As long as the <xref href="mosaic_libary.Stimulus" data-throw-if-not-resolved="false"></xref>  is in the "capture" state, it sends out

    the associated target value; as soon as the <xref href="mosaic_libary.Stimulus" data-throw-if-not-resolved="false"></xref> exits the "capture" state, it sends off a null value, just once.
