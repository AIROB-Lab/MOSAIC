    startLine: 34
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    The Selector class receives a tuple as input (e.g., <code>(string, Vector)</code>) and forwards 

    only the second element of that tuple as output.
  example:
  - >-
    <pre><code class="lang-csharp">selector: 

    {
      Type: Selector,
      Inputs: [ myTupleBlock ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: Selector</code> indicates this block will take a tuple from its input 
        and output only the tuple’s second element (e.g., a <xref href="MathNet.Numerics.LinearAlgebra.Vector%601" data-throw-if-not-resolved="false"></xref>).</li><li><code>Inputs: [ myTupleBlock ]</code> shows that the Selector expects a single 
        input block named <code>myTupleBlock</code>, which produces a tuple <code>(string, Vector)</code>.</li></ul>

    In this configuration, whenever the <code>myTupleBlock</code> sends a tuple like <code>("identifier", VectorOfValues)</code>, 

    the Selector extracts <code>VectorOfValues</code> and forwards it as output to any downstream blocks.
