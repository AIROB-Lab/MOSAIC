  langs:
  - csharp
  - vb
  name: HannesHand
  nameWithType: HannesHand
  fullName: mosaic_libary.HannesHand
  type: Class
  source:
    id: HannesHand
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\HannesHand.cs
    startLine: 192
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Communicates with the physical Hannes Prosthetic Hand via serial communication over Bluetooth. 

    This Block aims to implement the Communication Protocol specified in "SW_HannesBTCommProtocol.docx" file to send joint reference commands.
  remarks: >-
    <p>
      <strong>How to use it:</strong>
    </p>

    <ol><li>
        Connect the Rehab Dongle to the PC. (Optionally set the COM port to <code>COM50</code> in the 
        Windows Device Manager, or specify a different COM port in the block’s <code>Params</code>.)
      </li><li>Turn on the Hannes hand.</li><li>Open the COM port (e.g., <code>COM50</code>).</li><li>Scan for Hannes devices.</li><li>
        Select the device (if found) from the drop-down menu and connect to it. 
        If the ping procedure is successful, the Hannes hand is ready to receive commands.
      </li></ol>
  example:
  - >-
    <pre><code class="lang-csharp">myHannesHand: 

    {
      Type: HannesHand,
      Inputs: [ myControlBlock ],
      Params: [ "COM50" ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: HannesHand</code> identifies this block for controlling 
        the Hannes prosthetic hand over serial/Bluetooth.</li><li><code>Inputs: [ myControlBlock ]</code> indicates a single input block 
        that provides a <code>Dictionary&lt;OldDOAs, double&gt;</code> of DOF (degree-of-freedom) activation values.</li><li><code>Params: [ "COM50" ]</code> sets the COM port name 
        (in this case, <code>COM50</code>) for communication with the Rehab Dongle. This parameter is optional, default is COM50.</li></ul>

    In this configuration, the HannesHand class uses serial commands to transmit the DOF values 

    coming from <code>myControlBlock</code> directly to the Hannes prosthetic hand.
  syntax:
    content: 'public class HannesHand : Block, IDisposable'
    content.vb: Public Class HannesHand Inherits Block Implements IDisposable
