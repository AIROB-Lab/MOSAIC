    id: Delsys
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\Delsys\Delsys.cs
    startLine: 250
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Provides an interface for acquiring data from Delsys Trigno hardware using the Delsys SPI.

    <p><b>Disclaimer:</b> This block requires a valid Delsys API license and key for use with Delsys hardware.

    You must provide your unique key (<xref href="mosaic_libary.Delsys._key" data-throw-if-not-resolved="false"></xref>) and license (<xref href="mosaic_libary.Delsys._license" data-throw-if-not-resolved="false"></xref>) in the source code before using any Delsys device functionality.

    </p>
  remarks: >-
    The block will initialize and manage a Delsys Trigno base, allow scanning and selection of sensors,

    and provide live EMG data streaming as output vectors.

    <p><b>Important:</b> You must enter your Delsys SPI key and license in the fields <code>_key</code> and <code>_license</code> in the source code.

    </p>
  example:
  - >-
    <p>

    Example YAML configuration for a Delsys block:

    </p>

    <pre><code class="lang-csharp">delsysBlock:

    {
      Type: Delsys,
      Inputs: [myTimer]
    }</code></pre>

    <p>

    Explanation:

    <ul><li><code>Type: Delsys</code> specifies that this block will stream EMG data from a Delsys Trigno system.
        </li><li><code>Inputs: [myTimer]</code> specifies a timer block that triggers data acquisition.
        </li></ul></p>
  syntax:
    content: 'public class Delsys : Block, IDisposable'
    content.vb: Public Class Delsys Inherits Block Implements IDisposable
