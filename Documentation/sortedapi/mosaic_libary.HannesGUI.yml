  source:
    id: HannesGUI
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\HannesGUI.cs
    startLine: 43
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    The HannesGUI class controls the virtual Hannes prosthetic arm (HannesGUI by IIT) by sending activation values over a UDP port. 

    It can also send raw EMG values and ARVs (average rectified values) for logging. 

    The data is formatted into distinct byte arrays for each type of information:

    <ul><li>(7 bytes) Activation values: <code>%</code>, <code>15</code>, <code>#s</code>, <code>#a</code>, <code>&amp;</code>, <code>\r</code>, <code>\n</code></li><li>(N+5 bytes) Raw EMG values: <code>%</code>, <code>16</code>, <code>raw EMG bytes</code>, <code>&amp;</code>, <code>\r</code>, <code>\n</code></li><li>(M+5 bytes) ARVs (8-byte doubles each): <code>%</code>, <code>32</code>, <code>ARV bytes</code>, <code>&amp;</code>, <code>\r</code>, <code>\n</code></li></ul>
  example:
  - >-
    <pre><code class="lang-csharp">myHannesArm:

    {
      Type: HannesArm,
      Inputs: [ myPredictions, myRawEMG, myARVs ],
      Params: [ "192.168.0.10", 8889, 8, 64 ]
    }</code></pre>

    Explanation:

    <ul><li><code>Type: HannesArm</code> indicates this block interfaces with the Hannes prosthesis.</li><li><code>Inputs: [ myPredictions, myRawEMG, myARVs ]</code> define the 
        blocks that provide control signals, raw EMGs, and ARVs, respectively.</li><li><code>Params: [ "192.168.0.10", 8889, 8, 64 ]</code> are the host IP, the UDP port,
          the number of raw EMG bytes, and the number of ARV bytes. These determine the byte array sizes 
          for sending data to the Hannes device.</li></ul>
  syntax:
    content: 'public class HannesGUI : Block, IDisposable'
    content.vb: Public Class HannesGUI Inherits Block Implements IDisposable
