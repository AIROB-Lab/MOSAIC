  nameWithType: CfgParser.CfgBlock.DesiredRate
  fullName: mosaic_libary.CfgParser.CfgBlock.DesiredRate
  type: Property
  source:
    id: DesiredRate
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Basics.cs
    startLine: 467
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    The desired rate or frequency for the block's operation, if applicable.

    For example, a <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref> block may use this to define its trigger rate (in Hz).

    Blocks that process data streams, such as filters or resamplers, may also rely on this value.

    Often Blocks like <xref href="mosaic_libary.Function" data-throw-if-not-resolved="false"></xref> or <xref href="mosaic_libary.Trigger" data-throw-if-not-resolved="false"></xref> inherited the <xref href="mosaic_libary.CfgParser.CfgBlock.DesiredRate" data-throw-if-not-resolved="false"></xref> from the their Input Block.

    It is used to claculated if the Block is stumbeling, lagging or idle.
  example: []
  syntax:
    content: public double DesiredRate { get; set; }
    parameters: []
    return:
      type: System.Double
    content.vb: Public Property DesiredRate As Double
  overload: mosaic_libary.CfgParser.CfgBlock.DesiredRate*
