- uid: mosaic_libary.BlenderArm.OnNewInput(mosaic_libary.Block,System.Object)
  commentId: M:mosaic_libary.BlenderArm.OnNewInput(mosaic_libary.Block,System.Object)
  id: OnNewInput(mosaic_libary.Block,System.Object)
  parent: mosaic_libary.BlenderArm
  langs:
  - csharp
  - vb
  name: OnNewInput(Block, object)
  nameWithType: BlenderArm.OnNewInput(Block, object)
  fullName: mosaic_libary.BlenderArm.OnNewInput(mosaic_libary.Block, object)
  type: Method
  source:
    id: OnNewInput
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\BlenderArm.cs
    startLine: 126
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Processes new input received from the connected input block and converts the prediction Vector into a command format understood by the Blender arm model for UDP transmission. This method transforms the received prediction Vector, consisting of degrees of actuation for various parts of the arm, into a format compatible with the Blender model's expectations, and sends the formatted command over UDP.
  remarks: >-
    The method expects the input dictionary to contain specific keys corresponding to the OldDOAs defined by the enumeration. It maps these inputs to a 9-element Vector that aligns with the Blender arm model's input format. The mapping includes:

    - Scaling the values for thumb flexion, thumb rotation, Index, Middle, Ring, and Little finger positions from a [0, 100] range to [0, 1].

    - Converting wrist flexion/extension, ulnar/radial deviation, and supination/pronation values from a [0, 100] range to a [-1, 1] range, where necessary, to accommodate the model's expected input range for these motions.

    The final command is then sent as a string representation of the Vector over UDP to the specified host and port.
  example: []
  syntax:
    content: protected override void OnNewInput(Block sender, object value)
    parameters:
    - id: sender
      type: mosaic_libary.Block
      description: The block sending the input. This represents the source of the input data.
    - id: value
      type: System.Object
      description: The input value, which is expected to be a dictionary mapping degrees of actuation (OldDOAs) to their predicted values. The dictionary keys represent different parts of the arm (e.g., thumb flexion, wrist extension), and the values are the predicted actuation strengths or positions, on a scale from 0 to 100.
    content.vb: Protected Overrides Sub OnNewInput(sender As Block, value As Object)
  overridden: mosaic_libary.Block.OnNewInput(mosaic_libary.Block,System.Object)
  overload: mosaic_libary.BlenderArm.OnNewInput*
  nameWithType.vb: BlenderArm.OnNewInput(Block, Object)
  fullName.vb: mosaic_libary.BlenderArm.OnNewInput(mosaic_libary.Block, Object)
  name.vb: OnNewInput(Block, Object)
