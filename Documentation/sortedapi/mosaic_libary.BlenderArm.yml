  namespace: mosaic_libary
  summary: BlenderArm - Send off control values on a UDP port to a Blender arm model.
  remarks: " From the 12 values generated by our predictors, build 9, substantially by composing the\r\n DOFs of the wrist in pairs, e.g. wrist_flexion-wrist_extension. <br />\r\n The order of the internal (received) prediction Vector, as defined in the cfg file, is:\r\n [ ThumbFlexion, ThumbRotation, Index, Middle, Ring, Little, wr_flex, wr_ext, wr_pron, wr_sup, wr_ulnar, wr_radial ]\r\n all values in [0,...,1] <br />\r\n the order to be send to the Blender arm, as defined in 3DHands_left.py:\r\n [ ThumbFlexion, ThumbRotation, Index, Middle, Ring, Little, WristFlexionExtension, WristUlnarSupination, WirstUlnarPronation ]\r\n six values in [0,...,1] and three values in [-1,...,1]\r\n <table><tbody><tr><td class=\"term\">thumb flexion</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">thumb rotation</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">Index flexion</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">Middle flexion</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">Ring flexion</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">Little flexion</td><td class=\"description\">\r\n [0,1]\r\n </td></tr><tr><td class=\"term\">wrist flex ent</td><td class=\"description\">\r\n [-1,1] (flex is -1, ext is 1)\r\n </td></tr><tr><td class=\"term\">wrist uln rad</td><td class=\"description\">\r\n [-1,1] (ulnar is -1, radial is 1)\r\n </td></tr><tr><td class=\"term\">wrist sup pron</td><td class=\"description\">\r\n [-1,1] (sup is -1, pron is 1)\r\n </td></tr></tbody></table>\r\n for example,\r\n [1,1,1,1,1,1,0,0,0] is a fist with no wrist activation;\r\n[0,0,0,0,0,0,-1,0,1] is an open hand with flexed and pronated wrist."
  example: []
  syntax:
    content: 'public class BlenderArm : Block, IDisposable'
    content.vb: Public Class BlenderArm Inherits Block Implements IDisposable
