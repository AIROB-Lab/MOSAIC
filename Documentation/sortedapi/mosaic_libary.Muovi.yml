    id: Muovi
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Devices\Muovi.cs
    startLine: 75
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Represents a specialized <xref href="mosaic_libary.Block" data-throw-if-not-resolved="false"></xref> that handles data streaming from a Muovi device over a TCP connection.
  remarks: >-
    This class connects to a Muovi Syncstation device, configures its data acquisition settings, and streams incoming data. 

    It relies on a <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref> Block to drive its updates (e.g., how frequently data is processed).
  example:
  - >-
    <p>

    A minimal YAML configuration might look like this:

    </p>

    <pre><code class="lang-csharp">muovi:

    {
      Type: Muovi,
      Inputs: [ myTimerBlock ],
      Params: [ 0, 1, 2 ]
    }</code></pre>

    <p>

    Explanation:

    <ul><li><code>Type: Muovi</code> indicates this block communicates with the Muovi Syncstation.</li><li><code>Inputs: [ myTimerBlock ]</code> ensures it has exactly one <xref href="mosaic_libary.Timer" data-throw-if-not-resolved="false"></xref> (or <xref href="mosaic_libary.ScheduledTimer" data-throw-if-not-resolved="false"></xref>) 
        dictating how frequently data frames are parsed and output.</li><li><code>Params: [ 0, 1, 2 ]</code> lists the **probe indices** (subtracting 1 from the actual probe number). 
        For example, if the hardware label on the back of the probe is 3, you would add <code>2</code> to this list. Double check with the LEDs on the Syncstation. Probes tend to rename themselves to Probe 1.</li></ul></p>
  syntax:
    content: 'public class Muovi : Block, IDisposable'
    content.vb: Public Class Muovi Inherits Block Implements IDisposable
