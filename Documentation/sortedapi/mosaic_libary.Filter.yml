    id: Filter
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\Filter.cs
    startLine: 82
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: A simple FIR/IIR filtering block that applies a filter equation to multi-dimensional signals.
  remarks: >-
    Implements the equation:


    $$x_\text{filtered}(t) = \text{numerator} \cdot x(t,t-1,\ldots,t-N)\;-\;\text{denominator} \cdot x_\text{filtered}(t-1,t-2,\ldots,t-M)$$


    Use tools like MATLAB to generate the numerator and denominator coefficients. For example:

    <ul><li>Butterworth filter: <code>[num, den] = butter(3, 5/(200/2))</code></li><li>Moving average: <code>num = ones(1, N)/N, den = zeros(1, N)</code></li></ul>


    This block operates on multi-dimensional signals, processing the current sample and returning the filtered sample.
  example:
  - >-
    The <xref href="mosaic_libary.Filter" data-throw-if-not-resolved="false"></xref> Block needs a data providing Block as input and the filter coefficients as parameters.

    <pre><code class="lang-csharp">LowPassFilter: 

    {
        Type: Filter,
        Inputs: [DataBlock],
        Params: [0.00094469;0.0018894;0.00094469, 1;-1.9112;0.91498 ]
    }</code></pre>
  syntax:
    content: 'public class Filter : Block, IDisposable'
    content.vb: Public Class Filter Inherits Block Implements IDisposable
