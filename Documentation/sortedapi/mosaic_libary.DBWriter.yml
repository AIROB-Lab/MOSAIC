- uid: mosaic_libary.DBWriter.UpdateBufferSize(System.Int32)
  commentId: M:mosaic_libary.DBWriter.UpdateBufferSize(System.Int32)
  id: UpdateBufferSize(System.Int32)
  parent: mosaic_libary.DBWriter
  langs:
  - csharp
  - vb
  name: UpdateBufferSize(int)
  nameWithType: DBWriter.UpdateBufferSize(int)
  fullName: mosaic_libary.DBWriter.UpdateBufferSize(int)
  type: Method
  source:
    id: UpdateBufferSize
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Utils.cs
    startLine: 141
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Updates the buffer size based on the desired rate to ensure the buffer capacity aligns with the rate at which data is expected to be processed. 

    This adjustment is necessary because the desired rate of blocks may be determined by the blocks to which they are subscribed, which can occur after initial buffer setup.

    This method recalculates the buffer size to maintain data for a fixed duration, typically 10 seconds, based on the newly set desired rate.
  example: []
  syntax:
    content: public void UpdateBufferSize(int bufferSize = 500)
    parameters:
    - id: bufferSize
      type: System.Int32
      description: >-
        The new buffer size, calculated to hold 10 seconds' worth of data at the current desired rate. 
            This size is used to adjust the buffer's capacity to ensure 
            it can accommodate the expected volume of incoming data without overflow or excessive memory usage.
    content.vb: Public Sub UpdateBufferSize(bufferSize As Integer = 500)
  overload: mosaic_libary.DBWriter.UpdateBufferSize*
  nameWithType.vb: DBWriter.UpdateBufferSize(Integer)
  fullName.vb: mosaic_libary.DBWriter.UpdateBufferSize(Integer)
  name.vb: UpdateBufferSize(Integer)
