    id: AdaptiveFilter
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\AdaptiveFilter.cs
    startLine: 119
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Adaptive filter for heteroscedastic signals, where noise variance increases with signal magnitude.
  remarks: >-
    This time-discrete IIR low-pass filter dynamically adjusts its cutoff frequency based on the 

    current signal magnitude and the magnitude of its filtered derivative. The primary purpose is to 

    provide robust filtering for signals with varying noise characteristics.

    For more information, refer to the [publication](https://ieeexplore.ieee.org/document/10304772).
  example:
  - "<pre><code class=\"lang-csharp\">af2: { Type: AdaptiveFilter, DesiredRate: 200, Inputs: [ af1 ],  Params: [ '0.7', '-1', '-7', '8'] }</code></pre>"
