  source:
    id: Alpha
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\AdaptiveFilter.cs
    startLine: 179
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Gets or sets the alpha parameter, which is used to filter the first derivative.

    When set, this value recalculates the internal derivative filter coefficient.
  remarks: >-
    The alpha value is related to the derivative filter coefficient as:


    $$\text{Alpha} = \frac{\text{DerivativeFilter} \cdot \text{SamplingRate}}{(1 - \text{DerivativeFilter}) \cdot 2\pi}$$
  example: []
  syntax:
    content: public double Alpha { get; set; }
    parameters: []
    return:
      type: System.Double
    content.vb: Public Property Alpha As Double
  overload: mosaic_libary.AdaptiveFilter.Alpha*
- uid: mosaic_libary.AdaptiveFilter.CutoffFrequency
  commentId: P:mosaic_libary.AdaptiveFilter.CutoffFrequency
  id: CutoffFrequency
  parent: mosaic_libary.AdaptiveFilter
  langs:
  - csharp
  - vb
  name: CutoffFrequency
  nameWithType: AdaptiveFilter.CutoffFrequency
  fullName: mosaic_libary.AdaptiveFilter.CutoffFrequency
  type: Property
  source:
    id: CutoffFrequency
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Blocks\AdaptiveFilter.cs
    startLine: 193
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: Gets the current cutoff frequency of the adaptive filter.
  remarks: >-
    The cutoff frequency is dynamically adjusted based on the following formula:


    $$F_c = e^{\text{Offset} + \text{DerivativeContribution} \cdot |X_\text{dot\_filt}| + \text{MagnitudeContribution} \cdot |X|}$$
  example: []
  syntax:
    content: public double CutoffFrequency { get; }
    parameters: []
    return:
      type: System.Double
    content.vb: Public ReadOnly Property CutoffFrequency As Double
  overload: mosaic_libary.AdaptiveFilter.CutoffFrequency*
