- uid: mosaic_libary.AdaptiveFilter.Alpha
  commentId: P:mosaic_libary.AdaptiveFilter.Alpha
  id: Alpha
  parent: mosaic_libary.AdaptiveFilter
  langs:
  - csharp
  - vb
  name: Alpha
  nameWithType: AdaptiveFilter.Alpha
  fullName: mosaic_libary.AdaptiveFilter.Alpha
