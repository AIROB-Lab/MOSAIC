  namespace: mosaic_libary
  summary: Predicts outputs for a batch of input samples.
  example: []
  syntax:
    content: public abstract Matrix<double> Predict(Matrix<double> X)
    parameters:
    - id: X
      type: MathNet.Numerics.LinearAlgebra.Matrix{System.Double}
      description: >-
        A matrix where each row represents an input sample, and each column corresponds to a feature.
            The number of columns must match the input dimensionality (d).
    return:
      type: MathNet.Numerics.LinearAlgebra.Matrix{System.Double}
      description: >-
        A matrix where each row represents the predicted output for the corresponding input sample,
            and each column corresponds to an output dimension (M).
    content.vb: Public MustOverride Function Predict(X As Matrix(Of Double)) As Matrix(Of Double)
