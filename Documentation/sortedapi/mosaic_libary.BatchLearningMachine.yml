  nameWithType: BatchLearningMachine.BuildModel(Matrix<double>, Matrix<double>)
  fullName: mosaic_libary.BatchLearningMachine.BuildModel(MathNet.Numerics.LinearAlgebra.Matrix<double>, MathNet.Numerics.LinearAlgebra.Matrix<double>)
  type: Method
  source:
    id: BuildModel
    path: C:\Users\ma19mony\Desktop\MOSAIC\MOSAIC\MosaicLibary\Learning.cs
    startLine: 104
  assemblies:
  - iM
  namespace: mosaic_libary
  summary: >-
    Builds the predictive model using a batch of input-output samples.

    This method constructs the model in a one-shot process, which means the model is trained 

    with the provided data and cannot be incrementally updated afterward.
  example: []
  syntax:
    content: public abstract void BuildModel(Matrix<double> X, Matrix<double> Y)
    parameters:
    - id: X
      type: MathNet.Numerics.LinearAlgebra.Matrix{System.Double}
      description: >-
        A matrix where each row represents an input sample, and each column corresponds to a feature.
            The number of columns must match the input dimensionality (d).
    - id: Y
      type: MathNet.Numerics.LinearAlgebra.Matrix{System.Double}
      description: >-
        A matrix where each row represents the corresponding output for the input sample in <code class="paramref">X</code>.
            The number of columns must match the output dimensionality (M).
    content.vb: Public MustOverride Sub BuildModel(X As Matrix(Of Double), Y As Matrix(Of Double))
  overload: mosaic_libary.BatchLearningMachine.BuildModel*
  nameWithType.vb: BatchLearningMachine.BuildModel(Matrix(Of Double), Matrix(Of Double))
  fullName.vb: mosaic_libary.BatchLearningMachine.BuildModel(MathNet.Numerics.LinearAlgebra.Matrix(Of Double), MathNet.Numerics.LinearAlgebra.Matrix(Of Double))
  name.vb: BuildModel(Matrix(Of Double), Matrix(Of Double))
