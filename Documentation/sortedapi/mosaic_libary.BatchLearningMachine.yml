- uid: mosaic_libary.BatchLearningMachine.BuildModel(MathNet.Numerics.LinearAlgebra.Matrix{System.Double},MathNet.Numerics.LinearAlgebra.Matrix{System.Double})
  commentId: M:mosaic_libary.BatchLearningMachine.BuildModel(MathNet.Numerics.LinearAlgebra.Matrix{System.Double},MathNet.Numerics.LinearAlgebra.Matrix{System.Double})
  id: BuildModel(MathNet.Numerics.LinearAlgebra.Matrix{System.Double},MathNet.Numerics.LinearAlgebra.Matrix{System.Double})
  parent: mosaic_libary.BatchLearningMachine
